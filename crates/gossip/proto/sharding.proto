syntax = "proto3";

package kitsune2.gossip.sharding;

// A Kitsune2 sharding protocol message.
//
// Sent on the "k2sharding" transport module channel, separate from the
// gossip protocol so that sharding coordination can evolve without
// touching the gossip message enum.
message K2ShardingMessage {
  oneof msg {
    // An announcement of intent to shrink a storage arc.
    K2ShardingShrinkIntentMessage shrink_intent = 1;

    // A liveness probe; see K2ShardingProbeMessage.
    K2ShardingProbeMessage probe = 2;
  }
}

// A liveness probe, with no content. An agent sends it to the holders of
// the half it would grow into: gossip runs only between agents whose arcs
// overlap, so without it a holder of that half could die unnoticed, and
// the gap it left stay hidden until its agent info expired. A failed send
// marks the holder unresponsive, as for any other send. Receivers ignore
// it; ones that do not know it decode an empty message and ignore that.
message K2ShardingProbeMessage {}

// Announces that the sending agent intends to shrink its storage arc,
// vacating the given range of DHT locations.
//
// This is phase one of a two-phase shrink. The sender waits long enough
// for the announcement to have propagated, then re-checks that the vacated
// range would still meet the redundancy target with this agent, and
// competing intenders, gone. Receivers use pending intents in their own
// controllers: sectors covered by an announced vacate are treated as
// already lost when deciding whether to grow and when re-checking their
// own shrinks.
message K2ShardingShrinkIntentMessage {
  // The agent id of the intender.
  bytes agent_id = 1;

  // Inclusive start DHT location of the range being vacated.
  uint32 vacate_start = 2;

  // Inclusive end DHT location of the range being vacated.
  uint32 vacate_end = 3;

  // Timestamp (microseconds since the UNIX epoch) after which this intent
  // is void and must be ignored, whether or not it was executed.
  int64 expires_at_us = 4;

  // True to withdraw the sender's earlier intent with exactly this
  // expiry: the sender stood down and keeps holding the range. Receivers
  // drop that intent at once instead of letting it age out.
  bool withdrawn = 5;

  // True for an intent to GROW into the range rather than vacate it: the
  // sender means to take the given range, which adjoins the arc it holds
  // (V7 coordinated growth). Receivers that do not know this field read
  // it as a vacate of a range the sender does not hold, which their
  // declared-range check already discards, so mixing versions is safe.
  bool grow = 6;
}
